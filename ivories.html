document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ restart }}\" style=\"border: 1px solid #2A2F38; border-radius: 11px; background: #14181F; color: #C9CFD9; font-family: inherit; font-size: 14px; font-weight: 500; padding: 12px 18px; cursor: pointer; transition: border-color 140ms ease, color 140ms ease;\" style-hover=\"border-color: #3D444F; color: #F2EFE9;\">Restart<\u002Fbutton>\n          <div style=\"flex: 1 1 auto;\"><\u002Fdiv>\n          <div style=\"font-size: 12px; color: #6B7280; letter-spacing: 0.02em;\">Letters on the keys map to your computer keyboard — one octave, C4 to C5<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <aside style=\"flex: 0 0 268px; border-left: 1px solid #1B1E24; background: #0C0E11; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto;\">\n\n        <div>\n          <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #7C8492; font-weight: 600; margin-bottom: 12px;\">Wait for me<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleWait }}\" style=\"width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid {{ waitBorder }}; border-radius: 12px; background: {{ waitBg }}; padding: 13px 15px; cursor: pointer; font-family: inherit; text-align: left;\">\n            <span style=\"font-size: 13px; font-weight: 500; color: #F2EFE9;\">Pause on each note<\u002Fspan>\n            <span style=\"flex: 0 0 34px; height: 20px; border-radius: 10px; background: {{ waitTrack }}; position: relative; transition: background 160ms ease;\">\n              <span style=\"position: absolute; top: 2px; left: {{ waitKnob }}; width: 16px; height: 16px; border-radius: 50%; background: #0A0B0D; transition: left 160ms ease;\"><\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n          <p style=\"margin: 9px 0 0; font-size: 11.5px; line-height: 1.5; color: #6B7280;\">The song holds still until you find the right key. Best setting for your first pass.<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;\">\n            <span style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #7C8492; font-weight: 600;\">Tempo<\u002Fspan>\n            <span style=\"font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;\">{{ tempoLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <input type=\"range\" min=\"30\" max=\"140\" step=\"2\" value=\"{{ tempo }}\" sc-camel-on-input=\"{{ onTempo }}\" style=\"width: 100%; accent-color: #E8B45C; background: transparent; cursor: pointer;\">\n          <div style=\"display: flex; justify-content: space-between; font-size: 10px; color: #565E6B; margin-top: 4px; letter-spacing: 0.06em;\">\n            <span>SLOW<\u002Fspan>\n            <span>FULL SPEED<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #7C8492; font-weight: 600; margin-bottom: 12px;\">You play<\u002Fdiv>\n          <div style=\"display: flex; gap: 6px;\">\n            <sc-for list=\"{{ handOptions }}\" as=\"h\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"flex: 1 1 0; border: 1px solid {{ h.border }}; border-radius: 10px; background: {{ h.bg }}; color: {{ h.fg }}; font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 10px 4px; cursor: pointer; transition: all 140ms ease;\">{{ h.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin: 9px 0 0; font-size: 11.5px; line-height: 1.5; color: #6B7280;\">Whatever you don't play, Ivories plays for you.<\u002Fp>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #7C8492; font-weight: 600; margin-bottom: 12px;\">Loop a section<\u002Fdiv>\n          <div style=\"display: flex; gap: 6px;\">\n            <sc-for list=\"{{ loopOptions }}\" as=\"l\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"flex: 1 1 0; border: 1px solid {{ l.border }}; border-radius: 10px; background: {{ l.bg }}; color: {{ l.fg }}; font-family: inherit; font-size: 12px; font-weight: 500; padding: 10px 2px; cursor: pointer; transition: all 140ms ease;\">{{ l.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: auto; border-top: 1px solid #1B1E24; padding-top: 20px;\">\n          <div style=\"font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #7C8492; font-weight: 600; margin-bottom: 11px;\">Up next<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <div style=\"flex: 0 0 38px; height: 38px; border-radius: 10px; background: #171B22; border: 1px solid #232830; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #8A92A0;\">♩<\u002Fdiv>\n            <div style=\"min-width: 0;\">\n              <div style=\"font-size: 13px; font-weight: 500; letter-spacing: -0.01em;\">Left hand alone<\u002Fdiv>\n              <div style=\"font-size: 11.5px; color: #6B7280; margin-top: 1px;\">Lesson 5 · 4 min<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;tempo&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:68,&quot;min&quot;:30,&quot;max&quot;:140,&quot;step&quot;:2,&quot;unit&quot;:&quot;BPM&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Practice&quot;},&quot;waitMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Practice&quot;},&quot;playHand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Right&quot;,&quot;options&quot;:[&quot;Right&quot;,&quot;Left&quot;,&quot;Both&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Practice&quot;},&quot;showNoteNames&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nconst PPB = 92;\nconst NAMES = [\"C\", \"C#\", \"D\", \"D#\", \"E\", \"F\", \"F#\", \"G\", \"G#\", \"A\", \"A#\", \"B\"];\nconst LOW = 48, HIGH = 84;\nconst RIFF = [\n  [0,0.5,69,\"R\"],[0.5,0.5,72,\"R\"],[1,1,76,\"R\"],[2.5,0.5,74,\"R\"],[3,1,72,\"R\"],\n  [4,0.5,71,\"R\"],[4.5,0.5,74,\"R\"],[5,1,77,\"R\"],[6.5,0.5,76,\"R\"],[7,1,74,\"R\"],\n  [8,0.5,69,\"R\"],[8.5,0.5,72,\"R\"],[9,1,76,\"R\"],[10.5,0.5,79,\"R\"],[11,1,77,\"R\"],\n  [12,0.5,76,\"R\"],[12.5,0.5,74,\"R\"],[13,1.5,72,\"R\"],[14.5,0.5,71,\"R\"],[15,1,69,\"R\"],\n  [0,1.5,57,\"L\"],[2,1,60,\"L\"],[3,1,55,\"L\"],[4,1.5,53,\"L\"],[6,1,60,\"L\"],[7,1,55,\"L\"],\n  [8,1.5,57,\"L\"],[10,1,60,\"L\"],[11,1,55,\"L\"],[12,1.5,53,\"L\"],[14,1,55,\"L\"],[15,1,57,\"L\"]\n];\nconst TOTAL = 16;\nconst KEYMAP = { a: 60, w: 61, s: 62, e: 63, d: 64, f: 65, t: 66, g: 67, y: 68, h: 69, u: 70, j: 71, k: 72 };\nconst MAPPED = {};\nObject.keys(KEYMAP).forEach(k => { MAPPED[KEYMAP[k]] = k.toUpperCase(); });\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      playing: false, wait: this.props.waitMode !== false,\n      tempo: this.props.tempo || 68, hand: this.props.playHand || \"Right\",\n      loop: \"All\", hits: 0, misses: 0, streak: 0, bar: 1\n    };\n    this.trackRef = React.createRef();\n    this.waitRef = React.createRef();\n    this.waitTextRef = React.createRef();\n    this.keyboardRef = React.createRef();\n    this.playhead = 0;\n    this.held = new Set();\n    this.pending = null;\n    this.fired = new Set();\n    this.sounding = [];\n    this.buildKeys();\n    this.buildNotes();\n  }\n\n  buildKeys() {\n    const isBlack = m => [1,3,6,8,10].includes(m % 12);\n    this.whiteMidis = [];\n    for (let m = LOW; m <= HIGH; m++) if (!isBlack(m)) this.whiteMidis.push(m);\n    this.blackMidis = [];\n    for (let m = LOW; m <= HIGH; m++) if (isBlack(m)) this.blackMidis.push(m);\n    const n = this.whiteMidis.length;\n    this.wUnit = 100 / n;\n    this.pos = {};\n    this.whiteMidis.forEach((m, i) => { this.pos[m] = { left: i * this.wUnit, width: this.wUnit }; });\n    this.blackMidis.forEach(m => {\n      let below = m - 1;\n      const i = this.whiteMidis.indexOf(below);\n      const bw = this.wUnit * 0.62;\n      this.pos[m] = { left: (i + 1) * this.wUnit - bw / 2, width: bw };\n    });\n  }\n\n  buildNotes() {\n    this.notes = RIFF.map((r, idx) => {\n      const [t, dur, midi, hand] = r;\n      const p = this.pos[midi];\n      return {\n        idx, t, dur, midi, hand,\n        left: p.left, width: p.width,\n        bottom: Math.round(t * PPB), height: Math.round(dur * PPB) - 5,\n        fill: hand === \"R\" ? \"linear-gradient(180deg, #F0C177, #D89B3F)\" : \"linear-gradient(180deg, #7FD8C4, #3F9E8C)\",\n        glow: hand === \"R\" ? \"0 0 14px rgba(232,180,92,0.28)\" : \"0 0 14px rgba(110,231,168,0.20)\"\n      };\n    });\n  }\n\n  componentDidMount() {\n    this.keyEls = {};\n    const root = this.keyboardRef.current;\n    if (root) root.querySelectorAll(\"[data-key]\").forEach(el => { this.keyEls[el.getAttribute(\"data-key\")] = el; });\n    this.noteEls = {};\n    const tr = this.trackRef.current;\n    if (tr) tr.querySelectorAll(\"[data-note]\").forEach(el => { this.noteEls[el.getAttribute(\"data-note\")] = el; });\n    this.onKeyDown = e => {\n      const m = KEYMAP[e.key.toLowerCase()];\n      if (m && !e.repeat) { e.preventDefault(); this.press(m); }\n    };\n    this.onKeyUp = e => { const m = KEYMAP[e.key.toLowerCase()]; if (m) this.release(m); };\n    window.addEventListener(\"keydown\", this.onKeyDown);\n    window.addEventListener(\"keyup\", this.onKeyUp);\n    this.raf = requestAnimationFrame(this.tick);\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener(\"keydown\", this.onKeyDown);\n    window.removeEventListener(\"keyup\", this.onKeyUp);\n  }\n\n  audio() {\n    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();\n    if (this.ctx.state === \"suspended\") this.ctx.resume();\n    return this.ctx;\n  }\n\n  tone(midi, dur, gainMul) {\n    const ctx = this.audio();\n    const t = ctx.currentTime;\n    const f = 440 * Math.pow(2, (midi - 69) / 12);\n    const g = ctx.createGain();\n    const peak = 0.16 * (gainMul || 1);\n    g.gain.setValueAtTime(0.0001, t);\n    g.gain.exponentialRampToValueAtTime(peak, t + 0.012);\n    g.gain.exponentialRampToValueAtTime(peak * 0.35, t + 0.18);\n    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.4, dur));\n    const lp = ctx.createBiquadFilter();\n    lp.type = \"lowpass\"; lp.frequency.value = 3200;\n    [[1, \"triangle\", 1], [2, \"sine\", 0.3], [3, \"sine\", 0.12]].forEach(([mult, type, amp]) => {\n      const o = ctx.createOscillator();\n      o.type = type; o.frequency.value = f * mult;\n      const og = ctx.createGain(); og.gain.value = amp;\n      o.connect(og); og.connect(g);\n      o.start(t); o.stop(t + Math.max(0.5, dur) + 0.1);\n    });\n    g.connect(lp); lp.connect(ctx.destination);\n  }\n\n  lit(midi, color) {\n    const el = this.keyEls[midi];\n    if (!el) return;\n    const black = [1,3,6,8,10].includes(midi % 12);\n    if (color) {\n      el.style.background = black\n        ? \"linear-gradient(180deg, \" + color + \", \" + color + \")\"\n        : \"linear-gradient(180deg, \" + color + \" 0%, \" + color + \" 100%)\";\n      el.style.boxShadow = \"0 0 18px \" + color;\n    } else {\n      el.style.background = black\n        ? \"linear-gradient(180deg, #2A2F38 0%, #14171C 82%, #0B0D10 100%)\"\n        : \"linear-gradient(180deg, #EFEAE0 0%, #D8D2C6 88%, #BEB8AB 100%)\";\n      el.style.boxShadow = black ? \"0 3px 6px rgba(0,0,0,0.55)\" : \"inset 0 -3px 0 rgba(0,0,0,0.14)\";\n    }\n  }\n\n  mine(hand) {\n    const h = this.state.hand;\n    return h === \"Both\" || (h === \"Right\" && hand === \"R\") || (h === \"Left\" && hand === \"L\");\n  }\n\n  loopRange() {\n    const l = this.state.loop;\n    if (l === \"1–4\") return [0, 4];\n    if (l === \"5–8\") return [4, 8];\n    if (l === \"9–16\") return [8, 16];\n    return [0, TOTAL];\n  }\n\n  press(midi) {\n    this.held.add(midi);\n    this.tone(midi, 0.7, 1);\n    this.lit(midi, \"#E8B45C\");\n    if (this.pending) {\n      const want = this.pending.notes.filter(n => !this.pending.done.has(n.idx));\n      const match = want.find(n => n.midi === midi);\n      if (match) {\n        this.pending.done.add(match.idx);\n        const el = this.noteEls[match.idx];\n        if (el) el.firstChild.style.background = \"linear-gradient(180deg, #9DF3C6, #4FBF8C)\";\n        this.setState(s => ({ hits: s.hits + 1, streak: s.streak + 1 }));\n        if (this.pending.done.size >= this.pending.notes.length) {\n          this.pending = null;\n          if (this.waitRef.current) this.waitRef.current.style.display = \"none\";\n        } else if (this.waitTextRef.current) {\n          this.waitTextRef.current.textContent = this.chordLabel(this.pending);\n        }\n      } else {\n        this.setState(s => ({ misses: s.misses + 1, streak: 0 }));\n      }\n    }\n  }\n\n  release(midi) {\n    this.held.delete(midi);\n    const active = this.sounding.some(s => s.midi === midi);\n    if (!active) this.lit(midi, null);\n  }\n\n  chordLabel(p) {\n    const left = p.notes.filter(n => !p.done.has(n.idx));\n    return left.map(n => NAMES[n.midi % 12] + (Math.floor(n.midi / 12) - 1)).join(\" + \");\n  }\n\n  tick = (ts) => {\n    const last = this.lastTs || ts;\n    this.lastTs = ts;\n    const dt = Math.min(0.05, (ts - last) / 1000);\n    const [ls, le] = this.loopRange();\n\n    if (this.state.playing && !this.pending) {\n      const spb = 60 / this.state.tempo;\n      let next = this.playhead + dt / spb;\n\n      if (this.state.wait) {\n        const upcoming = this.notes\n          .filter(n => this.mine(n.hand) && !this.fired.has(n.idx) && n.t >= ls && n.t < le && n.t <= next)\n          .sort((a, b) => a.t - b.t);\n        if (upcoming.length) {\n          const t0 = upcoming[0].t;\n          const group = upcoming.filter(n => Math.abs(n.t - t0) < 0.01);\n          group.forEach(n => this.fired.add(n.idx));\n          next = t0;\n          this.pending = { notes: group, done: new Set() };\n          group.forEach(n => this.lit(n.midi, \"#E8B45C\"));\n          if (this.waitRef.current) this.waitRef.current.style.display = \"block\";\n          if (this.waitTextRef.current) this.waitTextRef.current.textContent = this.chordLabel(this.pending);\n        }\n      }\n\n      this.notes.forEach(n => {\n        if (this.fired.has(n.idx)) return;\n        if (n.t > next || n.t < ls || n.t >= le) return;\n        this.fired.add(n.idx);\n        if (this.mine(n.hand) && this.state.wait) return;\n        this.tone(n.midi, n.dur * (60 / this.state.tempo), this.mine(n.hand) ? 0.55 : 0.85);\n        this.sounding.push({ midi: n.midi, until: n.t + n.dur, mine: this.mine(n.hand) });\n        this.lit(n.midi, this.mine(n.hand) ? \"#E8B45C\" : \"#6EE7A8\");\n      });\n\n      if (next >= le) {\n        next = ls;\n        this.fired.clear();\n        this.sounding.forEach(s => this.lit(s.midi, null));\n        this.sounding = [];\n        Object.values(this.noteEls).forEach(el => { el.firstChild.style.background = \"\"; });\n        this.notes.forEach(n => { const el = this.noteEls[n.idx]; if (el) el.firstChild.style.background = n.fill; });\n      }\n      this.playhead = next;\n    }\n\n    this.sounding = this.sounding.filter(s => {\n      if (s.until <= this.playhead) { if (!this.held.has(s.midi)) this.lit(s.midi, null); return false; }\n      return true;\n    });\n\n    if (this.trackRef.current) {\n      this.trackRef.current.style.transform = \"translateY(\" + (this.playhead * PPB) + \"px)\";\n    }\n    const bar = Math.floor(this.playhead / 4) + 1;\n    if (bar !== this.state.bar) this.setState({ bar });\n    this.raf = requestAnimationFrame(this.tick);\n  };\n\n  reset() {\n    this.playhead = this.loopRange()[0];\n    this.pending = null;\n    this.fired.clear();\n    this.sounding.forEach(s => this.lit(s.midi, null));\n    this.sounding = [];\n    if (this.waitRef.current) this.waitRef.current.style.display = \"none\";\n    this.notes.forEach(n => { const el = this.noteEls && this.noteEls[n.idx]; if (el) el.firstChild.style.background = n.fill; });\n  }\n\n  renderVals() {\n    const st = this.state;\n    const total = st.hits + st.misses;\n    const pick = (on) => ({\n      bg: on ? \"#E8B45C\" : \"#14181F\",\n      fg: on ? \"#17130B\" : \"#C9CFD9\",\n      border: on ? \"#E8B45C\" : \"#2A2F38\"\n    });\n\n    return {\n      navItems: [\n        { glyph: \"◎\", label: \"Path\", bg: \"transparent\", fg: \"#7C8492\", onClick: () => {} },\n        { glyph: \"▤\", label: \"Songs\", bg: \"transparent\", fg: \"#7C8492\", onClick: () => {} },\n        { glyph: \"♪\", label: \"Play\", bg: \"#1A1D23\", fg: \"#E8B45C\", onClick: () => {} },\n        { glyph: \"◍\", label: \"Ear\", bg: \"transparent\", fg: \"#7C8492\", onClick: () => {} }\n      ],\n      trackRef: this.trackRef,\n      waitRef: this.waitRef,\n      waitTextRef: this.waitTextRef,\n      keyboardRef: this.keyboardRef,\n      trackHeight: TOTAL * PPB,\n      notes: this.notes,\n      beatLines: Array.from({ length: TOTAL + 1 }, (_, i) => ({\n        bottom: i * PPB, color: i % 4 === 0 ? \"#22272F\" : \"#171B21\"\n      })),\n      laneGuides: this.whiteMidis.map(m => ({\n        width: this.wUnit,\n        color: m % 12 === 0 ? \"#1E232B\" : \"#14181E\"\n      })),\n      whiteKeys: this.whiteMidis.map(m => ({\n        midi: m,\n        label: m % 12 === 0 ? \"C\" + (Math.floor(m / 12) - 1) : (this.props.showNoteNames ? NAMES[m % 12] : \"\"),\n        labelColor: m % 12 === 0 ? \"#8A7654\" : \"#A9A292\",\n        mapKey: MAPPED[m] || \"\",\n        mapBg: MAPPED[m] ? \"rgba(23,19,11,0.10)\" : \"transparent\",\n        mapFg: MAPPED[m] ? \"#6F6350\" : \"transparent\",\n        onDown: () => this.press(m),\n        onUp: () => this.release(m)\n      })),\n      blackKeys: this.blackMidis.map(m => ({\n        midi: m, left: this.pos[m].left, width: this.pos[m].width,\n        mapKey: MAPPED[m] || \"\",\n        mapBg: MAPPED[m] ? \"rgba(242,239,233,0.10)\" : \"transparent\",\n        mapFg: MAPPED[m] ? \"#B9C0CB\" : \"transparent\",\n        onDown: () => this.press(m),\n        onUp: () => this.release(m)\n      })),\n      playing: st.playing,\n      playGlyph: st.playing ? \"❙❙\" : \"▶\",\n      playLabel: st.playing ? \"Pause\" : \"Start playing\",\n      togglePlay: () => { this.audio(); this.setState(s => ({ playing: !s.playing })); },\n      restart: () => { this.reset(); this.setState({ hits: 0, misses: 0, streak: 0 }); },\n      tempo: st.tempo,\n      tempoLabel: st.tempo + \" BPM\",\n      onTempo: e => this.setState({ tempo: Number(e.target.value) }),\n      toggleWait: () => { this.pending = null; if (this.waitRef.current) this.waitRef.current.style.display = \"none\"; this.setState(s => ({ wait: !s.wait })); },\n      waitBg: st.wait ? \"rgba(232,180,92,0.10)\" : \"#14181F\",\n      waitBorder: st.wait ? \"#5C4A28\" : \"#2A2F38\",\n      waitTrack: st.wait ? \"#E8B45C\" : \"#2E333C\",\n      waitKnob: st.wait ? \"16px\" : \"2px\",\n      handOptions: [\"Right\", \"Left\", \"Both\"].map(h => ({\n        label: h, ...pick(st.hand === h),\n        onClick: () => { this.setState({ hand: h }); this.reset(); }\n      })),\n      loopOptions: [\"All\", \"1–4\", \"5–8\", \"9–16\"].map(l => ({\n        label: l, ...pick(st.loop === l),\n        onClick: () => { this.setState({ loop: l }, () => this.reset()); }\n      })),\n      accuracyLabel: total ? Math.round((st.hits / total) * 100) + \"%\" : \"—\",\n      hitLabel: String(st.hits),\n      streakLabel: String(st.streak),\n      barLabel: String(st.bar)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
