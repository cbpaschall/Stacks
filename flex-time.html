<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Current Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0A0B09; }
  body { font-family:'Manrope', system-ui, sans-serif; color:#F2F4EE; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#C9F24D; text-decoration:none; }
  a:hover { color:#E0FF8A; }
  input, button { font-family:inherit; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#26291F; border-radius:8px; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* ---- layout ---- */
  .ws { min-height:100vh; background:radial-gradient(120% 70% at 50% -10%, #14170F 0%, #0A0B09 60%); padding:28px 20px 64px; }
  .ws-inner { max-width:1100px; margin:0 auto; }
  .ws-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:32px; }
  .ws-title { font-family:'Instrument Serif', Georgia, serif; font-size:44px; line-height:1.02; letter-spacing:-0.01em; }
  .ws-sub { font-size:13px; color:#8A8F7E; margin-top:6px; }
  .ws-pill { display:flex; align-items:baseline; gap:7px; padding:10px 16px; border:1px solid #23271C; border-radius:999px; background:#101208; }
  .ws-pill b { font-family:'Instrument Serif', Georgia, serif; font-size:26px; line-height:1; color:#C9F24D; font-weight:400; }
  .ws-pill span { font-size:11px; color:#8A8F7E; text-transform:uppercase; letter-spacing:0.12em; }
  .ws-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .ws-label { font-size:11px; color:#8A8F7E; text-transform:uppercase; letter-spacing:0.16em; }
  .ws-hint { font-size:12px; color:#6E7364; }
  .ws-scroll { overflow-x:auto; margin:0 -20px; padding:0 20px 4px; }

  /* ---- tiles ---- */
  .ws-tiles { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; min-width:640px; }
  .ws-tile { position:relative; border:1px solid #23271C; border-radius:20px; background:linear-gradient(180deg,#13160D,#0E1009); padding:18px 18px 16px; cursor:pointer; user-select:none; transition:border-color .18s, transform .18s; }
  .ws-tile:hover { border-color:#C9F24D; transform:translateY(-2px); }
  .ws-tile.armed { border-color:#C9F24D; box-shadow:inset 0 0 24px rgba(201,242,77,0.18); }
  .ws-tile-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .ws-tile-name { font-family:'Instrument Serif', Georgia, serif; font-size:27px; line-height:1; }
  .ws-tile-blurb { font-size:12px; color:#8A8F7E; margin-top:10px; min-height:32px; line-height:1.45; }
  .ws-tile-foot { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid #1C2016; }
  .ws-tile-foot span:first-child { font-size:11px; color:#6E7364; text-transform:uppercase; letter-spacing:0.12em; }
  .ws-tile-foot span:last-child { font-size:11px; color:#C9F24D; }
  .ws-plus { flex:none; width:28px; height:28px; border-radius:999px; border:1px solid #2C3122; background:#0A0B09; color:#C9F24D; font-size:15px; line-height:1; cursor:pointer; }
  .ws-plus:hover { background:#C9F24D; color:#0A0B09; border-color:#C9F24D; }

  /* ---- week ---- */
  .ws-week { display:grid; grid-template-columns:repeat(7, minmax(96px,1fr)); gap:10px; min-width:742px; }
  .ws-day { min-height:154px; border-radius:18px; border:1px dashed #262A1E; background:#0D0F08; padding:12px; display:flex; flex-direction:column; gap:8px; transition:border-color .15s; }
  .ws-day:hover, .ws-day.over { border-color:#3A4029; }
  .ws-day.armable { border-color:#C9F24D; }
  .ws-day-top { display:flex; align-items:baseline; justify-content:space-between; }
  .ws-day-top span { font-size:11px; color:#8A8F7E; text-transform:uppercase; letter-spacing:0.14em; }
  .ws-day-top b { font-family:'Instrument Serif', Georgia, serif; font-size:19px; color:#4E5344; font-weight:400; }
  .ws-chip { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:7px 8px 7px 10px; border-radius:11px; background:#C9F24D; color:#0A0B09; }
  .ws-chip span { font-size:12px; font-weight:600; }
  .ws-chip button { border:none; background:none; color:#0A0B09; opacity:.55; font-size:14px; line-height:1; cursor:pointer; padding:0 2px; }
  .ws-chip button:hover { opacity:1; }
  .ws-empty { flex:1; display:flex; align-items:center; justify-content:center; font-size:11px; color:#3E432F; }
  .ws-ghost { background:none; border:none; color:#6E7364; font-size:12px; cursor:pointer; padding:4px 0; }
  .ws-ghost:hover { color:#C9F24D; }

  /* ---- modal ---- */
  .ws-overlay { position:fixed; inset:0; background:rgba(5,6,4,.72); backdrop-filter:blur(6px); z-index:40; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow:auto; }
  .ws-panel { width:100%; max-width:620px; background:#0E1009; border:1px solid #23271C; border-radius:24px; padding:26px; animation:rise .22s ease-out; }
  .ws-panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .ws-panel-title { font-family:'Instrument Serif', Georgia, serif; font-size:34px; line-height:1; }
  .ws-panel-blurb { font-size:12px; color:#8A8F7E; margin-top:7px; }
  .ws-x { flex:none; width:34px; height:34px; border-radius:999px; border:1px solid #2C3122; background:#0A0B09; color:#8A8F7E; font-size:16px; cursor:pointer; }
  .ws-x:hover { color:#C9F24D; border-color:#C9F24D; }
  .ws-list { display:flex; flex-direction:column; gap:8px; margin:22px 0 20px; }
  .ws-ex { display:flex; align-items:center; gap:12px; padding:10px; border:1px solid #1C2016; border-radius:14px; background:#101208; }
  .ws-thumb { width:48px; height:48px; border-radius:10px; flex:none; background-color:#171A10; background-size:cover; background-position:center; border:1px solid #23271C; display:flex; align-items:center; justify-content:center; font-family:'Instrument Serif', Georgia, serif; font-size:17px; color:#7C8270; }
  .ws-ex-name { font-size:14px; font-weight:600; }
  .ws-ex-scheme { font-size:12px; color:#8A8F7E; margin-top:3px; }
  .ws-del { border:none; background:none; color:#4E5344; font-size:16px; cursor:pointer; padding:4px 6px; }
  .ws-del:hover { color:#E8734A; }
  .ws-none { padding:22px; text-align:center; font-size:13px; color:#4E5344; border:1px dashed #23271C; border-radius:14px; }
  .ws-add { border-top:1px solid #1C2016; padding-top:20px; }
  .ws-drop { flex:none; width:104px; height:104px; border-radius:14px; border:1px dashed #2C3122; background:#101208 center/cover no-repeat; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; overflow:hidden; position:relative; text-align:center; }
  .ws-drop:hover { border-color:#C9F24D; }
  .ws-drop .p { font-size:20px; color:#C9F24D; line-height:1; }
  .ws-drop .t { font-size:10px; color:#6E7364; line-height:1.35; padding:0 8px; }
  .ws-input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #23271C; background:#101208; color:#F2F4EE; font-size:14px; outline:none; }
  .ws-input:focus { border-color:#C9F24D; }
  .ws-cta { flex:none; padding:12px 22px; border-radius:12px; border:none; background:#C9F24D; color:#0A0B09; font-size:14px; font-weight:700; cursor:pointer; }
  .ws-cta:hover { background:#E0FF8A; }
</style>
</head>
<body>
<div id="ws-root"></div>

<script>
(function () {
  var MOUNT = document.getElementById("ws-root");
  var KEY = "split.v1";
  var START_OF_WEEK = "Monday";           // or "Sunday"
  var ORDER_MON = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var ORDER_SUN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  var CATS = [
    { id:"legs", name:"Legs", blurb:"Squat, hinge, unilateral work." },
    { id:"push", name:"Push", blurb:"Chest, shoulders, triceps." },
    { id:"pull", name:"Pull", blurb:"Back, rear delts, biceps." },
    { id:"core", name:"Core", blurb:"Anti-extension, rotation, carries." },
    { id:"rest", name:"Rest", blurb:"Light cardio and mobility." }
  ];

  var STARTER = {
    legs:[["Back Squat",4,"5"],["Romanian Deadlift",3,"8"],["Bulgarian Split Squat",3,"10 / leg"],["Leg Curl",3,"12"],["Standing Calf Raise",4,"12"]],
    push:[["Bench Press",4,"6"],["Overhead Press",3,"8"],["Incline Dumbbell Press",3,"10"],["Cable Lateral Raise",3,"15"],["Overhead Triceps Extension",3,"12"]],
    pull:[["Weighted Pull-Up",4,"6"],["Barbell Row",3,"8"],["Chest-Supported Row",3,"10"],["Face Pull",3,"15"],["Incline Curl",3,"12"]],
    core:[["Hanging Leg Raise",3,"12"],["Ab Wheel Rollout",3,"10"],["Pallof Press",3,"12 / side"],["Suitcase Carry",3,"40m"],["Side Plank",3,"45s"]],
    rest:[["Zone 2 Walk",1,"30 min"],["Easy Bike",1,"20 min"],["90/90 Hip Switch",2,"10 / side"],["Thoracic Opener",2,"8"],["Couch Stretch",2,"60s / side"]]
  };

  var lib, week, open = null, armed = null, draft = { name:"", sets:"", reps:"", img:null }, dragCat = null;

  function emptyWeek() { var w = {}; ORDER_MON.forEach(function (k) { w[k] = []; }); return w; }

  function load() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
    if (saved && saved.lib) {
      lib = saved.lib;
      week = Object.assign(emptyWeek(), saved.week || {});
    } else {
      lib = {};
      CATS.forEach(function (c) {
        lib[c.id] = STARTER[c.id].map(function (e, i) {
          return { id:c.id + i, name:e[0], sets:e[1], reps:e[2], img:null };
        });
      });
      week = emptyWeek();
    }
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ lib:lib, week:week })); } catch (e) {} }

  function weekDates() {
    var startSun = START_OF_WEEK === "Sunday";
    var order = startSun ? ORDER_SUN : ORDER_MON;
    var now = new Date(), dow = now.getDay();
    var offset = startSun ? -dow : -((dow + 6) % 7);
    return order.map(function (short, i) {
      var d = new Date(now);
      d.setDate(now.getDate() + offset + i);
      return { short:short, num:d.getDate() };
    });
  }

  function cat(id) { return CATS.filter(function (c) { return c.id === id; })[0]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

  function assign(day, id) { if (!id) return; week[day] = (week[day] || []).concat([id]); armed = null; save(); render(); }

  function readImage(file, done) {
    if (!file || !/^image\//.test(file.type)) return;
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var scale = Math.min(1, 480 / Math.max(img.width, img.height));
      var cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      done(cv.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); };
    img.src = url;
  }

  function addExercise() {
    var name = (draft.name || "").trim();
    if (!open || !name) return;
    lib[open] = (lib[open] || []).concat([{
      id: open + "-" + Date.now(), name:name,
      sets: draft.sets || 3, reps: draft.reps || "10", img: draft.img
    }]);
    draft = { name:"", sets:"", reps:"", img:null };
    save(); render();
  }

  function render() {
    var days = weekDates();
    var planned = days.filter(function (d) { return (week[d.short] || []).length; }).length;
    var today = new Date().toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"short", year:"2-digit" });

    var html = '<div class="ws"><div class="ws-inner">' +
      '<header class="ws-head"><div><div class="ws-title">Current Split</div>' +
      '<div class="ws-sub">' + esc(today) + '</div></div>' +
      '<div class="ws-pill"><b>' + planned + '</b><span>days planned</span></div></header>' +
      '<div class="ws-bar"><div class="ws-label">Workout types</div><div class="ws-hint">' +
      (armed ? "Now tap a day below" : "Drag a tile onto a day, or tap + to assign") + '</div></div>' +
      '<div class="ws-scroll" style="margin-bottom:40px"><div class="ws-tiles">';

    CATS.forEach(function (c) {
      html += '<div class="ws-tile' + (armed === c.id ? " armed" : "") + '" draggable="true" data-tile="' + c.id + '">' +
        '<div class="ws-tile-top"><div class="ws-tile-name">' + esc(c.name) + '</div>' +
        '<button class="ws-plus" data-arm="' + c.id + '" title="Assign to a day">+</button></div>' +
        '<div class="ws-tile-blurb">' + esc(c.blurb) + '</div>' +
        '<div class="ws-tile-foot"><span>' + (lib[c.id] || []).length + ' movements</span><span>Open</span></div></div>';
    });

    html += '</div></div>' +
      '<div class="ws-bar"><div class="ws-label">This week</div>' +
      '<button class="ws-ghost" data-clear="1">Clear week</button></div>' +
      '<div class="ws-scroll"><div class="ws-week">';

    days.forEach(function (d) {
      var list = week[d.short] || [];
      html += '<div class="ws-day' + (armed ? " armable" : "") + '" data-day="' + d.short + '">' +
        '<div class="ws-day-top"><span>' + d.short + '</span><b>' + d.num + '</b></div>';
      list.forEach(function (id, i) {
        var c = cat(id);
        html += '<div class="ws-chip"><span>' + esc(c ? c.name : id) + '</span>' +
          '<button data-unassign="' + d.short + ':' + i + '">&times;</button></div>';
      });
      if (!list.length) html += '<div class="ws-empty">drop here</div>';
      html += '</div>';
    });

    html += '</div></div></div>';

    if (open) {
      var c = cat(open), list = lib[open] || [];
      html += '<div class="ws-overlay" data-close="1"><div class="ws-panel" data-stop="1">' +
        '<div class="ws-panel-head"><div><div class="ws-panel-title">' + esc(c.name) + '</div>' +
        '<div class="ws-panel-blurb">' + esc(c.blurb) + '</div></div>' +
        '<button class="ws-x" data-close="1">&times;</button></div><div class="ws-list">';
      if (!list.length) html += '<div class="ws-none">Nothing here yet. Add your first movement below.</div>';
      list.forEach(function (ex) {
        html += '<div class="ws-ex"><div class="ws-thumb"' +
          (ex.img ? ' style="background-image:url(\'' + ex.img + '\'); border-color:transparent"></div>' : '>' + esc(ex.name.charAt(0).toUpperCase()) + '</div>') +
          '<div style="flex:1;min-width:0"><div class="ws-ex-name">' + esc(ex.name) + '</div>' +
          '<div class="ws-ex-scheme">' + esc(ex.sets + " × " + ex.reps) + '</div></div>' +
          '<button class="ws-del" data-delex="' + ex.id + '">&times;</button></div>';
      });
      html += '</div><div class="ws-add"><div class="ws-label" style="margin-bottom:14px">Add a movement</div>' +
        '<div style="display:flex;gap:14px;flex-wrap:wrap">' +
        '<label class="ws-drop"' + (draft.img ? ' style="background-image:url(\'' + draft.img + '\')"' : '') + '>' +
        (draft.img ? '' : '<div class="p">+</div><div class="t">Drop or pick an image</div>') +
        '<input type="file" accept="image/*" data-pick="1" style="position:absolute;width:1px;height:1px;opacity:0"></label>' +
        '<div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px">' +
        '<input class="ws-input" data-f="name" value="' + esc(draft.name) + '" placeholder="Movement name">' +
        '<div style="display:flex;gap:10px">' +
        '<input class="ws-input" data-f="sets" value="' + esc(draft.sets) + '" placeholder="Sets" inputmode="numeric" style="flex:1;min-width:0">' +
        '<input class="ws-input" data-f="reps" value="' + esc(draft.reps) + '" placeholder="Reps" style="flex:1;min-width:0">' +
        '<button class="ws-cta" data-add="1">Add</button></div></div></div></div></div></div>';
    }

    MOUNT.innerHTML = html;
    wire();
  }

  function wire() {
    MOUNT.querySelectorAll("[data-tile]").forEach(function (el) {
      var id = el.getAttribute("data-tile");
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-arm]")) return;
        open = id; draft = { name:"", sets:"", reps:"", img:null }; render();
      });
      el.addEventListener("dragstart", function (e) { dragCat = id; if (e.dataTransfer) e.dataTransfer.effectAllowed = "copy"; });
      el.addEventListener("dragend", function () { dragCat = null; });
    });
    MOUNT.querySelectorAll("[data-arm]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = b.getAttribute("data-arm");
        armed = armed === id ? null : id; render();
      });
    });
    MOUNT.querySelectorAll("[data-day]").forEach(function (el) {
      var key = el.getAttribute("data-day");
      el.addEventListener("dragover", function (e) { e.preventDefault(); el.classList.add("over"); });
      el.addEventListener("dragleave", function () { el.classList.remove("over"); });
      el.addEventListener("drop", function (e) { e.preventDefault(); assign(key, dragCat); });
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-unassign]")) return;
        if (armed) assign(key, armed);
      });
    });
    MOUNT.querySelectorAll("[data-unassign]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var parts = b.getAttribute("data-unassign").split(":");
        week[parts[0]] = (week[parts[0]] || []).filter(function (_, i) { return i !== +parts[1]; });
        save(); render();
      });
    });
    var clear = MOUNT.querySelector("[data-clear]");
    if (clear) clear.addEventListener("click", function () { week = emptyWeek(); save(); render(); });

    MOUNT.querySelectorAll("[data-close]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest("[data-stop]") && !e.target.closest(".ws-x")) return;
        open = null; render();
      });
    });
    MOUNT.querySelectorAll("[data-delex]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delex");
        lib[open] = lib[open].filter(function (x) { return x.id !== id; });
        save(); render();
      });
    });
    MOUNT.querySelectorAll("[data-f]").forEach(function (input) {
      var f = input.getAttribute("data-f");
      input.addEventListener("input", function () { draft[f] = input.value; });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") addExercise(); });
    });
    var add = MOUNT.querySelector("[data-add]");
    if (add) add.addEventListener("click", addExercise);
    var pick = MOUNT.querySelector("[data-pick]");
    if (pick) pick.addEventListener("change", function () {
      readImage(pick.files && pick.files[0], function (url) { draft.img = url; render(); });
    });
    var drop = MOUNT.querySelector(".ws-drop");
    if (drop) {
      drop.addEventListener("dragover", function (e) { e.preventDefault(); });
      drop.addEventListener("drop", function (e) {
        e.preventDefault();
        readImage(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0], function (url) { draft.img = url; render(); });
      });
    }
  }

  load();
  render();
})();
</script>
</body>
</html>
